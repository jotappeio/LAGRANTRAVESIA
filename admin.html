<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Técnico — Latitud Sur Expedition</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root {
            --lse-dark: #07090e;
            --lse-card: #0f141f;
            --lse-border: #1f293d;
            --lse-orange: #f97316;
            --lse-gold: #fbbf24;
            --lse-text: #f3f4f6;
            --lse-muted: #9ca3af;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--lse-dark);
            color: var(--lse-text);
            margin: 0;
            padding: 20px;
        }

        .container { max-width: 1300px; margin: 0 auto; display: none; }
        h1, h3 { color: var(--lse-gold); text-align: center; }
        h1 { font-size: 22px; text-transform: uppercase; letter-spacing: 1px; }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 20px;
        }
        @media (max-width: 950px) { .grid { grid-template-columns: 1fr; } }
        
        .panel {
            background-color: var(--lse-card);
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
            border: 1px solid var(--lse-border);
            margin-bottom: 20px;
        }
        .map-admin { height: 260px; border-radius: 6px; border: 1px solid var(--lse-border); margin-bottom: 10px; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 13px; }
        th, td { padding: 8px 10px; text-align: left; border-bottom: 1px solid var(--lse-border); }
        th { background-color: #0b101c; color: var(--lse-muted); text-transform: uppercase; font-size: 11px; }
        
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
        .form-group { margin-bottom: 10px; }
        label { display: block; font-size: 11px; color: var(--lse-muted); margin-bottom: 3px; }
        
        input, select {
            width: 100%; padding: 8px; font-size: 13px;
            border-radius: 6px; border: 1px solid var(--lse-border);
            background-color: var(--lse-dark); color: white; box-sizing: border-box;
            outline: none;
        }
        input:focus, select:focus { border-color: var(--lse-orange); }

        button {
            background-color: var(--lse-orange); color: #fff; border: none;
            padding: 10px 15px; font-weight: 700; border-radius: 6px; cursor: pointer; width: 100%;
            text-transform: uppercase; font-size: 11px; letter-spacing: 0.5px;
        }
        button:hover { background-color: #ea580c; }
        .btn-danger { background-color: #dc2626; color: white; padding: 4px 8px; font-size: 11px; width: auto; }
        .btn-danger:hover { background-color: #b91c1c; }
        
        #loginOverlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: var(--lse-dark); display: flex; justify-content: center; align-items: center; z-index: 9999;
        }
        .login-box {
            background-color: var(--lse-card); padding: 30px; border-radius: 8px; width: 300px; text-align: center;
            border: 1px solid var(--lse-border); box-shadow: 0 10px 30px rgba(0,0,0,0.6);
        }
        
        .section-title {
            background-color: #131b2e; color: var(--lse-gold); padding: 10px 12px;
            font-size: 13px; font-weight: 700; text-transform: uppercase; border-bottom: 1px solid var(--lse-border);
            display: flex; justify-content: space-between;
        }

        .badge { padding: 3px 6px; border-radius: 4px; font-weight: 700; font-size: 11px; }
        .badge-fin { background-color: #059669; color: white; }
        .badge-carrera { background-color: #0284c7; color: white; }
        .badge-dnf { background-color: #dc2626; color: white; }
        .pos-badge { background-color: var(--lse-orange); color: white; font-weight: 800; padding: 2px 6px; border-radius: 4px; font-size: 11px; }
        .my-tooltip { background: var(--lse-card); color: var(--lse-gold); border: 1px solid var(--lse-orange); font-weight: bold; font-size: 11px; padding: 2px 6px; border-radius: 4px; }
    </style>
</head>
<body>

<!-- INGRESO CON CONTRASEÑA -->
<div id="loginOverlay">
    <div class="login-box">
        <span style="color: var(--lse-orange); font-size: 10px; font-weight: 800; letter-spacing: 2px; text-transform: uppercase;">Latitud Sur Expedition</span>
        <h3 style="margin: 5px 0 15px 0;">Panel de Operaciones</h3>
        <input type="password" id="accessPassword" placeholder="Contraseña..." style="margin-bottom: 15px; text-align: center;" onkeypress="handleKeyPress(event)">
        <button onclick="verificarPassword()">Acceder</button>
    </div>
</div>

<div class="container" id="mainContainer">
    <h1>Panel de Control Técnico — Eventos LSE</h1>
    
    <!-- CONFIGURACIÓN GENERAL Y MULTIMEDIA -->
    <div class="panel">
        <h3>1. Configuración General, Portada &amp; Video</h3>
        <div class="form-row">
            <div class="form-group"><label>Nombre del Evento:</label><input type="text" id="confNombreEvento"></div>
            <div class="form-group"><label>Fecha:</label><input type="text" id="confFecha"></div>
            <div class="form-group"><label>Ubicación:</label><input type="text" id="confUbicacion"></div>
        </div>
        <div class="form-row">
            <div class="form-group"><label>Logo Cabecera:</label><input type="file" id="logoCabeceraInput" accept="image/*" style="font-size:11px; padding:4px;"></div>
            <div class="form-group"><label>Imagen Portada (Banner):</label><input type="file" id="portadaInput" accept="image/*" style="font-size:11px; padding:4px;"></div>
        </div>
        <div class="form-row">
            <div class="form-group"><label>Logos Auspiciadores (Pie):</label><input type="file" id="logoPieInput" accept="image/*" style="font-size:11px; padding:4px;"></div>
            <div class="form-group"><label>URL o ID Video Vimeo (Ej: 952091357):</label><input type="text" id="vimeoInput" placeholder="952091357"></div>
        </div>
        <button onclick="guardarConfiguracionEvento()" style="width: auto; padding: 8px 20px;">Guardar Configuración General</button>
    </div>

    <!-- GESTIÓN DE RUTAS Y DISTANCIAS -->
    <div class="grid">
        <!-- RUTA 1 -->
        <div class="panel">
            <h3 style="color: var(--lse-orange);">Gestión Ruta 1</h3>
            <div class="form-group">
                <label>Nombre de Distancia (ej. 100K):</label>
                <input type="text" id="nombreRuta1" value="100K" onchange="guardarNombresRutas()">
            </div>
            <div id="map1" class="map-admin"></div>
            <div class="form-group"><label>Subir GPX Ruta 1:</label><input type="file" id="gpxFile1" accept=".gpx" style="font-size:11px; padding:4px;"></div>
            <div class="form-row">
                <div><label>Nombre del Control:</label><input type="text" id="nombrePC1" placeholder="Ej: PC 1 Km 30"></div>
                <div><label>Km en Ruta:</label><input type="number" id="kmPC1" placeholder="30" step="0.1"></div>
            </div>
            <button onclick="agregarPuntoControl(1)">Fijar Punto en Ruta 1</button>
            <div style="margin-top: 10px; max-height: 80px; overflow-y: auto;">
                <table id="tablaPC1"><tbody id="tbodyPC1"><tr><td style="color:var(--lse-muted);font-size:11px;">Sin puntos configurados.</td></tr></tbody></table>
            </div>
        </div>

        <!-- RUTA 2 -->
        <div class="panel">
            <h3 style="color: var(--lse-gold);">Gestión Ruta 2</h3>
            <div class="form-group">
                <label>Nombre de Distancia (ej. 50K):</label>
                <input type="text" id="nombreRuta2" value="50K" onchange="guardarNombresRutas()">
            </div>
            <div id="map2" class="map-admin"></div>
            <div class="form-group"><label>Subir GPX Ruta 2:</label><input type="file" id="gpxFile2" accept=".gpx" style="font-size:11px; padding:4px;"></div>
            <div class="form-row">
                <div><label>Nombre del Control:</label><input type="text" id="nombrePC2" placeholder="Ej: PC 1 Km 20"></div>
                <div><label>Km en Ruta:</label><input type="number" id="kmPC2" placeholder="20" step="0.1"></div>
            </div>
            <button onclick="agregarPuntoControl(2)">Fijar Punto en Ruta 2</button>
            <div style="margin-top: 10px; max-height: 80px; overflow-y: auto;">
                <table id="tablaPC2"><tbody id="tbodyPC2"><tr><td style="color:var(--lse-muted);font-size:11px;">Sin puntos configurados.</td></tr></tbody></table>
            </div>
        </div>
    </div>

    <!-- EDICIÓN RÁPIDA -->
    <div class="panel">
        <h3>Edición Rápida de Atleta</h3>
        <div class="form-row">
            <div class="form-group">
                <label>Seleccionar Dorsal:</label>
                <input type="text" id="inputDorsalBusqueda" list="listaCorredores" placeholder="Dorsal..." oninput="cargarDatosCorredorPorInput()">
                <datalist id="listaCorredores"></datalist>
            </div>
            <div class="form-group"><label>Atleta:</label><input type="text" id="editNombre" readonly style="background:var(--lse-dark); color:var(--lse-muted);"></div>
            <div class="form-group">
                <label>Estado:</label>
                <select id="editEstado">
                    <option value="En Carrera">En Carrera</option>
                    <option value="FINALIZADO">FINALIZADO</option>
                    <option value="DNF">DNF</option>
                </select>
            </div>
        </div>
        <button onclick="guardarCambiosCorredor()" style="width: auto; padding: 8px 20px;">Actualizar Estado</button>
        <span id="msgFeedback" style="font-size: 11px; margin-left: 10px; color: #059669;"></span>
    </div>

    <!-- TABLA GENERAL -->
    <div class="panel">
        <h3>Listado General por Clasificación</h3>
        <div id="contenedorSeccionesAdmin" style="margin-top: 15px;"></div>
    </div>
</div>

<!-- Leaflet y GPX -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet-gpx/1.7.0/gpx.min.js"></script>

<script>
    const CLAVE_AUTORIZADA = "101082";
    let map1, map2, gpxLayer1, gpxLayer2;
    let datosEvento = { corredores: [] };
    let puntosGPX1 = [], puntosGPX2 = [];
    let puntosControl1 = [], puntosControl2 = [];
    let marcadoresPC1 = [], marcadoresPC2 = [];
    let columnasDinamicasGlobales = [];

    window.onload = function() {
        if (localStorage.getItem("adminUltimoAcceso")) concederAcceso();
        cargarConfiguracionForm();
    };

    function verificarPassword() {
        if (document.getElementById('accessPassword').value === CLAVE_AUTORIZADA) {
            localStorage.setItem("adminUltimoAcceso", new Date().getTime().toString());
            concederAcceso();
        } else { alert("Contraseña incorrecta."); }
    }
    function handleKeyPress(e) { if (e.key === "Enter") verificarPassword(); }

    function concederAcceso() {
        document.getElementById('loginOverlay').style.display = 'none';
        document.getElementById('mainContainer').style.display = 'block';
        setTimeout(initMapasAdmin, 250);
        cargarDatosJSON();
        setInterval(cargarDatosJSON, 15000);
    }

    function cargarConfiguracionForm() {
        document.getElementById('confNombreEvento').value = localStorage.getItem("lse_evento_nombre") || "La Gran Travesía 100K";
        document.getElementById('confFecha').value = localStorage.getItem("lse_evento_fecha") || "Octubre 2026";
        document.getElementById('confUbicacion').value = localStorage.getItem("lse_evento_ubicacion") || "Chile";
        document.getElementById('nombreRuta1').value = localStorage.getItem("lse_nombre_ruta1") || "100K";
        document.getElementById('nombreRuta2').value = localStorage.getItem("lse_nombre_ruta2") || "50K";
        document.getElementById('vimeoInput').value = localStorage.getItem("lse_vimeo_id") || "952091357";
    }

    function guardarNombresRutas() {
        localStorage.setItem("lse_nombre_ruta1", document.getElementById('nombreRuta1').value.trim());
        localStorage.setItem("lse_nombre_ruta2", document.getElementById('nombreRuta2').value.trim());
    }

    function guardarConfiguracionEvento() {
        guardarNombresRutas();
        localStorage.setItem("lse_evento_nombre", document.getElementById('confNombreEvento').value);
        localStorage.setItem("lse_evento_fecha", document.getElementById('confFecha').value);
        localStorage.setItem("lse_evento_ubicacion", document.getElementById('confUbicacion').value);
        localStorage.setItem("lse_vimeo_id", document.getElementById('vimeoInput').value.trim());

        const f1 = document.getElementById('logoCabeceraInput').files[0];
        if (f1) { let r = new FileReader(); r.onload = e => localStorage.setItem("lse_logo_cabecera", e.target.result); r.readAsDataURL(f1); }
        
        const fPortada = document.getElementById('portadaInput').files[0];
        if (fPortada) { let r = new FileReader(); r.onload = e => localStorage.setItem("lse_portada_img", e.target.result); r.readAsDataURL(fPortada); }

        const f2 = document.getElementById('logoPieInput').files[0];
        if (f2) { let r = new FileReader(); r.onload = e => localStorage.setItem("lse_logo_pie", e.target.result); r.readAsDataURL(f2); }
        
        alert("¡Configuración general guardada exitosamente!");
    }

    function initMapasAdmin() {
        if (!map1) {
            map1 = L.map('map1').setView([-33.35, -70.65], 11);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 18 }).addTo(map1);
        }
        if (!map2) {
            map2 = L.map('map2').setView([-33.35, -70.65], 11);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 18 }).addTo(map2);
        }

        const gpx1 = localStorage.getItem("lse_gpx_ruta1");
        if (gpx1) procesarGPXTexto(gpx1, 1, false);
        const gpx2 = localStorage.getItem("lse_gpx_ruta2");
        if (gpx2) procesarGPXTexto(gpx2, 2, false);

        document.getElementById('gpxFile1').addEventListener('change', function(e) {
            let file = e.target.files[0]; if(!file) return;
            let r = new FileReader();
            r.onload = evt => {
                localStorage.setItem("lse_gpx_ruta1", evt.target.result);
                localStorage.removeItem("lse_pcs_ruta1");
                puntosControl1 = [];
                procesarGPXTexto(evt.target.result, 1, true);
            };
            r.readAsText(file);
        });

        document.getElementById('gpxFile2').addEventListener('change', function(e) {
            let file = e.target.files[0]; if(!file) return;
            let r = new FileReader();
            r.onload = evt => {
                localStorage.setItem("lse_gpx_ruta2", evt.target.result);
                localStorage.removeItem("lse_pcs_ruta2");
                puntosControl2 = [];
                procesarGPXTexto(evt.target.result, 2, true);
            };
            r.readAsText(file);
        });

        restaurarPuntosControlAdmin();
    }

    function procesarGPXTexto(gpxText, rutaNum, centrar) {
        let mapObj = rutaNum === 1 ? map1 : map2;
        let layerObj = rutaNum === 1 ? gpxLayer1 : gpxLayer2;
        if (layerObj) mapObj.removeLayer(layerObj);

        let colorRuta = rutaNum === 1 ? '#f97316' : '#fbbf24';
        let nuevaLayer = new L.GPX(gpxText, { async: true, polyline_options: { color: colorRuta, weight: 4, opacity: 0.9 } })
            .on('loaded', e => { if (centrar) mapObj.fitBounds(e.target.getBounds()); })
            .addTo(mapObj);

        if (rutaNum === 1) gpxLayer1 = nuevaLayer; else gpxLayer2 = nuevaLayer;

        let parser = new DOMParser();
        let xml = parser.parseFromString(gpxText, "text/xml");
        let trkpts = xml.getElementsByTagName("trkpt");
        let arrPuntos = []; let distAcum = 0, prev = null;

        for (let i = 0; i < trkpts.length; i++) {
            let lat = parseFloat(trkpts[i].getAttribute("lat"));
            let lon = parseFloat(trkpts[i].getAttribute("lon"));
            let curr = L.latLng(lat, lon);
            if (i > 0 && prev) distAcum += prev.distanceTo(curr);
            prev = curr;
            arrPuntos.push({ latlng: curr, distanciaKm: distAcum / 1000 });
        }
        if (rutaNum === 1) puntosGPX1 = arrPuntos; else puntosGPX2 = arrPuntos;
    }

    function agregarPuntoControl(rutaNum) {
        let nombre = document.getElementById(`nombrePC${rutaNum}`).value.trim();
        let kmTarget = parseFloat(document.getElementById(`kmPC${rutaNum}`).value);
        let puntosGPX = rutaNum === 1 ? puntosGPX1 : puntosGPX2;

        if (!nombre || isNaN(kmTarget) || puntosGPX.length === 0) {
            alert("Ingrese un nombre, km válido y asegúrese de haber cargado el GPX de esta ruta.");
            return;
        }

        let masCercano = puntosGPX[0];
        let menorDiff = Math.abs(masCercano.distanciaKm - kmTarget);
        for (let i = 1; i < puntosGPX.length; i++) {
            let diff = Math.abs(puntosGPX[i].distanciaKm - kmTarget);
            if (diff < menorDiff) { menorDiff = diff; masCercano = puntosGPX[i]; }
        }

        let nuevoPC = { id: new Date().getTime(), nombre: nombre, km: kmTarget, lat: masCercano.latlng.lat, lon: masCercano.latlng.lng };
        if (rutaNum === 1) puntosControl1.push(nuevoPC); else puntosControl2.push(nuevoPC);
        guardarYRenderizarPCs(rutaNum);

        document.getElementById(`nombrePC${rutaNum}`).value = "";
        document.getElementById(`kmPC${rutaNum}`).value = "";
    }

    function guardarYRenderizarPCs(rutaNum) {
        if (rutaNum === 1) localStorage.setItem("lse_pcs_ruta1", JSON.stringify(puntosControl1));
        else localStorage.setItem("lse_pcs_ruta2", JSON.stringify(puntosControl2));
        renderizarPCsEnMapaYTabla(rutaNum);
    }

    function restaurarPuntosControlAdmin() {
        let g1 = localStorage.getItem("lse_pcs_ruta1");
        if (g1) { puntosControl1 = JSON.parse(g1); renderizarPCsEnMapaYTabla(1); }
        let g2 = localStorage.getItem("lse_pcs_ruta2");
        if (g2) { puntosControl2 = JSON.parse(g2); renderizarPCsEnMapaYTabla(2); }
    }

    function renderizarPCsInMap(rutaNum) {
        let mapObj = rutaNum === 1 ? map1 : map2;
        let marcadores = rutaNum === 1 ? marcadoresPC1 : marcadoresPC2;
        let puntos = rutaNum === 1 ? puntosControl1 : puntosControl2;
        let colorHex = rutaNum === 1 ? '#f97316' : '#fbbf24';

        marcadores.forEach(m => mapObj.removeLayer(m));
        marcadores.length = 0;

        puntos.forEach(pt => {
            let marker = L.circleMarker([pt.lat, pt.lon], {
                radius: 8, fillColor: colorHex, color: "#fff", weight: 2, fillOpacity: 1
            }).addTo(mapObj)
              .bindTooltip(`<b>${pt.nombre}</b> (Km ${pt.km})`, {permanent: true, direction: 'top', className: 'my-tooltip'});
            marcadores.push(marker);
        });
    }

    function renderizarPCsEnMapaYTabla(rutaNum) {
        renderizarPCsInMap(rutaNum);
        let puntos = rutaNum === 1 ? puntosControl1 : puntosControl2;
        let tbody = document.getElementById(`tbodyPC${rutaNum}`);
        tbody.innerHTML = "";

        if (puntos.length === 0) {
            tbody.innerHTML = `<tr><td style="color:var(--lse-muted);font-size:11px;">Sin puntos configurados.</td></tr>`;
            return;
        }

        puntos.forEach(pt => {
            tbody.innerHTML += `<tr>
                <td style="font-size:12px;"><b>${pt.nombre}</b> (Km ${pt.km})</td>
                <td style="text-align:right;"><button class="btn-danger" onclick="eliminarPC(${rutaNum}, ${pt.id})">Borrar</button></td>
            </tr>`;
        });
    }

    function eliminarPC(rutaNum, id) {
        if (rutaNum === 1) puntosControl1 = puntosControl1.filter(p => p.id !== id);
        else puntosControl2 = puntosControl2.filter(p => p.id !== id);
        guardarYRenderizarPCs(rutaNum);
    }

    function cargarDatosJSON() {
        fetch('data.json?t=' + new Date().getTime())
            .then(res => res.json())
            .then(data => {
                datosEvento = data;
                poblarDatalistCorredores();
                if (data.corredores.length > 0) {
                    let p = data.corredores[0];
                    let ign = ["dorsal", "nombre", "categoria", "distancia", "sexo", "estado", "TIEMPO DE CARRERA"];
                    columnasDinamicasGlobales = Object.keys(p).filter(k => !ign.includes(k));
                    construirSeccionesAdmin(data.corredores);
                }
            });
    }

    function poblarDatalistCorredores() {
        let dl = document.getElementById('listaCorredores');
        dl.innerHTML = '';
        datosEvento.corredores.forEach(c => {
            dl.innerHTML += `<option value="${c.dorsal}">${c.nombre} (#${c.dorsal})</option>`;
        });
    }

    function cargarDatosCorredorPorInput() {
        let val = document.getElementById('inputDorsalBusqueda').value.trim();
        let c = datosEvento.corredores.find(x => x.dorsal.toString() === val);
        document.getElementById('editNombre').value = c ? c.nombre : '';
        if (c) document.getElementById('editEstado').value = c.estado || 'En Carrera';
    }

    function guardarCambiosCorredor() {
        let val = document.getElementById('inputDorsalBusqueda').value.trim();
        let c = datosEvento.corredores.find(x => x.dorsal.toString() === val);
        if (c) {
            c.estado = document.getElementById('editEstado').value;
            document.getElementById('msgFeedback').innerText = "¡Actualizado!";
            construirSeccionesAdmin(datosEvento.corredores);
        } else alert("Seleccione un dorsal válido.");
    }

    function convertirHoraASegundos(strHora) {
        if (!strHora || strHora === "-") return 999999;
        let p = strHora.split(":");
        if (p.length < 2) return 999999;
        return (parseInt(p[0]) * 3600) + (parseInt(p[1]) * 60) + (p[2] ? parseInt(p[2]) : 0);
    }

    function construirSeccionesAdmin(corredores) {
        let copia = [...corredores];
        copia.sort((a, b) => {
            let ea = (a.estado||"").toUpperCase(), eb = (b.estado||"").toUpperCase();
            let fa = ea.includes("FIN")||ea.includes("FINALIZADO"), fb = eb.includes("FIN")||eb.includes("FINALIZADO");
            if (fa && !fb) return -1; if (!fa && fb) return 1;
            if (fa && fb) return convertirHoraASegundos(a["TIEMPO DE CARRERA"]) - convertirHoraASegundos(b["TIEMPO DE CARRERA"]);
            if (ea.includes("DNF") && !eb.includes("DNF")) return 1;
            if (!ea.includes("DNF") && eb.includes("DNF")) return -1;
            return 0;
        });

        let grupos = {};
        copia.forEach(c => {
            let d = c.distancia || "100K", cat = c.categoria || "INDIVIDUAL", s = c.sexo || "M";
            let k = `${d} — ${cat} (${s})`;
            if (!grupos[k]) grupos[k] = [];
            grupos[k].push(c);
        });

        let cont = document.getElementById('contenedorSeccionesAdmin');
        cont.innerHTML = "";
        for (let [gNombre, atletas] of Object.entries(grupos)) {
            let html = `<div style="margin-bottom:20px; border:1px solid var(--lse-border); border-radius:6px; overflow:hidden;">
                <div class="section-title"><span>${gNombre}</span><span style="font-size:11px; color:var(--lse-muted);">${atletas.length} Atletas</span></div>
                <div style="overflow-x:auto;"><table><thead><tr><th>Pos</th><th>Dorsal</th><th>Atleta</th><th>Estado</th><th style="color:var(--lse-gold);">Tiempo</th>`;
            columnasDinamicasGlobales.forEach(col => html += `<th>${col}</th>`);
            html += `</tr></thead><tbody>`;

            atletas.forEach((c, idx) => {
                let badge = "badge-carrera", eu = (c.estado||"").toUpperCase();
                if (eu.includes("FIN")||eu.includes("FINALIZADO")) badge = "badge-fin";
                else if (eu.includes("DNF")) badge = "badge-dnf";
                let pos = (eu.includes("FIN")||eu.includes("FINALIZADO")) ? `<span class="pos-badge">${idx+1}</span>` : `-`;

                html += `<tr><td>${pos}</td><td><b>#${c.dorsal}</b></td><td>${c.name || c.nombre}</td><td><span class="badge ${badge}">${c.estado}</span></td><td style="color:var(--lse-gold);font-weight:bold;">${c["TIEMPO DE CARRERA"]||'-'}</td>`;
                columnasDinamicasGlobales.forEach(col => html += `<td>${c[col]||'-'}</td>`);
                html += `</tr>`;
            });
            html += `</tbody></table></div></div>`;
            cont.innerHTML += html;
        }
    }
</script>

</body>
