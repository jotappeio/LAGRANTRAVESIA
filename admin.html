<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Admin - La Gran Travesía 100K</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0b1329;
            color: #ffffff;
            margin: 0;
            padding: 20px;
        }
        .container { max-width: 1200px; margin: 0 auto; }
        h1, h3 { color: #f39c12; text-align: center; }
        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 20px;
        }
        @media (max-width: 900px) { .grid { grid-template-columns: 1fr; } }
        .panel {
            background-color: #162247;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            margin-bottom: 20px;
        }
        #map { height: 400px; border-radius: 6px; border: 1px solid #2c3e50; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 13px; }
        th, td { padding: 10px; text-align: left; border-bottom: 1px solid #2c3e50; }
        th { background-color: #1f2d5a; color: #f39c12; }
        .badge { padding: 3px 6px; border-radius: 4px; font-weight: bold; font-size: 11px; }
        .badge-fin { background-color: #27ae60; color: white; }
        .badge-carrera { background-color: #2980b9; color: white; }
        .badge-dnf { background-color: #c0392b; color: white; }
    </style>
</head>
<body>

<div class="container">
    <h1>PANEL DE CONTROL INTERNO - LA GRAN TRAVESÍA 100K</h1>
    
    <div class="grid">
        <!-- Panel Izquierdo: Mapa de Ruta -->
        <div class="panel">
            <h3>Mapa & Puestos de Control</h3>
            <div id="map"></div>
        </div>

        <!-- Panel Derecho: Monitoreo en Vivo -->
        <div class="panel">
            <h3>Monitoreo de Campo (Data JSON)</h3>
            <div style="overflow-x: auto;">
                <table id="adminTable">
                    <thead>
                        <tr>
                            <th>Dorsal</th>
                            <th>Atleta</th>
                            <th>Estado</th>
                            <th>Último Punto</th>
                        </tr>
                    </thead>
                    <tbody id="adminTbody"></tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<!-- Leaflet JS y Plugin GPX -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet-gpx/1.7.0/gpx.min.js"></script>

<script>
    // Inicializar Mapa con OpenStreetMap (Libre y sin errores de API Key)
    const map = L.map('map').setView([-33.35, -70.65], 11);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap contributors',
        maxZoom: 18
    }).addTo(map);

    // Cargar archivo GPX de la ruta si existe en el repositorio
    try {
        new L.GPX('ruta.gpx', { 
            async: true, 
            polyline_options: { color: '#e67e22', weight: 4, opacity: 0.8 } 
        }).on('loaded', function(e) {
            map.fitBounds(e.target.getBounds());
        }).addTo(map);
    } catch(e) {
        console.log("Archivo ruta.gpx no encontrado aún.");
    }

    // Puestos de control de referencia en el mapa
    const puntosControl = [
        { nombre: "Base Camp / Largada", coords: [-33.38, -70.68] },
        { nombre: "Control Km 50", coords: [-33.30, -70.58] },
        { nombre: "Control Km 81", coords: [-33.25, -70.50] },
        { nombre: "Meta Oficial", coords: [-33.38, -70.68] }
    ];

    puntosControl.forEach(pc => {
        L.circleMarker(pc.coords, { radius: 8, fillColor: "#e74c3c", color: "#fff", weight: 2, fillOpacity: 1 })
         .addTo(map).bindPopup(`<b>${pc.nombre}</b>`);
    });

    // Cargar datos de corredores desde data.json
    function cargarDatosAdmin() {
        fetch('data.json?t=' + new Date().getTime())
            .then(res => res.json())
            .then(data => {
                const tbody = document.getElementById('adminTbody');
                tbody.innerHTML = "";

                data.corredores.forEach(c => {
                    let badgeClass = "badge-carrera";
                    if (c.estado === "FIN") badgeClass = "badge-fin";
                    if (c.estado === "DNF") badgeClass = "badge-dnf";

                    let ultimoPunto = "Largada";
                    if (c.meta && c.meta !== "-") ultimoPunto = "Meta (" + c.meta + ")";
                    else if (c.km81 && c.km81 !== "-") ultimoPunto = "Km 81 (" + c.km81 + ")";
                    else if (c.km50 && c.km50 !== "-") ultimoPunto = "Km 50 (" + c.km50 + ")";
                    else if (c.largada && c.largada !== "-") ultimoPunto = "Largada (" + c.largada + ")";

                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td><strong>#${c.dorsal}</strong></td>
                        <td>${c.nombre}</td>
                        <td><span class="badge ${badgeClass}">${c.estado}</span></td>
                        <td>${ultimoPunto}</td>
                    `;
                    tbody.appendChild(tr);
                });
            })
            .catch(err => console.error("Error cargando data.json", err));
    }

    cargarDatosAdmin();
    setInterval(cargarDatosAdmin, 15000);
</script>

</body>
</html>
