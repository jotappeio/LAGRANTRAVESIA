<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Admin - La Gran Travesía 100K</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0b1329;
            color: #ffffff;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        h1 {
            color: #f39c12;
            text-align: center;
        }
        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 20px;
        }
        @media (max-width: 900px) {
            .grid { grid-template-columns: 1fr; }
        }
        .panel {
            background-color: #162247;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        #map {
            height: 450px;
            border-radius: 6px;
            border: 1px solid #2c3e50;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            font-size: 13px;
        }
        th, td {
            padding: 10px;
            text-align: left;
            border-bottom: 1px solid #2c3e50;
        }
        th {
            background-color: #1f2d5a;
            color: #f39c12;
        }
        .badge {
            padding: 3px 6px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 11px;
        }
        .badge-fin { background-color: #27ae60; color: white; }
        .badge-carrera { background-color: #2980b9; color: white; }
        .badge-dnf { background-color: #c0392b; color: white; }
    </style>
</head>
<body>

<div class="container">
    <h1>PANEL DE CONTROL INTERNO - LA GRAN TRAVESÍA 100K</h1>
    
    <div class="grid">
        <!-- Panel Izquierdo: Mapa de Ruta y Puntos de Control -->
        <div class="panel">
            <h3>Mapa de Ruta & Puestos de Control</h3>
            <p style="font-size: 12px; color: #95a5a6;">Visualización general del trazado GPX y posición estimada de los controles.</p>
            <div id="map"></div>
        </div>

        <!-- Panel Derecho: Estado de Competidores en Vivo -->
        <div class="panel">
            <h3>Monitoreo de Campo (Data JSON)</h3>
            <div style="overflow-x: auto;">
                <table id="adminTable">
                    <thead>
                        <tr>
                            <th>Dorsal</th>
                            <th>Atleta</th>
                            <th>Estado</th>
                            <th>Último Punto</th>
                        </tr>
                    </thead>
                    <tbody id="adminTbody">
                        <!-- Cargado dinámicamente -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<!-- Leaflet JS y Plugin de GPX -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet-gpx/1.7.0/gpx.min.js"></script>

<script>
    // 1. Inicializar el Mapa centrado en la zona (ej. Precordillera / Peldehue)
    const map = L.map('map').setView([-33.35, -70.65], 11);

    // Capa base de mapa oscuro/técnico (CartoDB Dark Matter)
    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
        attribution: '&copy; <a href="https://carto.com/">CARTO</a>',
        maxZoom: 18
    }).addTo(map);

    // 2. Cargar el archivo GPX de la ruta (debe estar en tu repositorio como 'ruta.gpx')
    // Si aún no subes el GPX, puedes comentar esta sección temporalmente
    const gpxPath = 'ruta.gpx'; 
    new L.GPX(gpxPath, {
        async: true,
        polyline_options: {
            color: '#f39c12',
            weight: 4,
            opacity: 0.8
        },
        marker_options: {
            startIcon: null,
            endIcon: null,
            wptIcons: {}
        }
    }).on('loaded', function(e) {
        map.fitBounds(e.target.getBounds());
    }).addTo(map);

    // 3. Puntos de Control Fijos en el Mapa (Coordenadas de referencia aproximadas)
    const puntosControl = [
        { nombre: "Base Camp / Largada", coords: [-33.38, -70.68], id: "LARGADA" },
        { nombre: "Control Km 50", coords: [-33.30, -70.58], id: "KM50" },
        { nombre: "Control Km 81", coords: [-33.25, -70.50], id: "KM81" },
        { nombre: "Meta Oficial", coords: [-33.38, -70.68], id: "META" }
    ];

    puntosControl.forEach(pc => {
        L.circleMarker(pc.coords, {
            radius: 8,
            fillColor: "#e74c3c",
            color: "#fff",
            weight: 2,
            fillOpacity: 1
        }).addTo(map).bindPopup(`<b>${pc.nombre}</b>`);
    });

    // 4. Cargar datos de corredores desde data.json
    function cargarAdminData() {
        fetch('data.json?t=' + new Date().getTime())
            .then(res => res.json())
            .then(data => {
                const tbody = document.getElementById('adminTbody');
                tbody.innerHTML = "";

                data.corredores.forEach(c => {
                    let badgeClass = "badge-carrera";
                    if (c.estado === "FIN") badgeClass = "badge-fin";
                    if (c.estado === "DNF") badgeClass = "badge-dnf";

                    // Determinar el último punto alcanzado
                    let ultimoPunto = "Largada";
                    if (c.meta && c.meta !== "-") ultimoPunto = "Meta (" + c.meta + ")";
                    else if (c.km81 && c.km81 !== "-") ultimoPunto = "Km 81 (" + c.km81 + ")";
                    else if (c.km50 && c.km50 !== "-") ultimoPunto = "Km 50 (" + c.km50 + ")";
                    else if (c.largada && c.largada !== "-") ultimoPunto = "Largada (" + c.largada + ")";

                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td><strong>#${c.dorsal}</strong></td>
                        <td>${c.nombre}</td>
                        <td><span class="badge ${badgeClass}">${c.estado}</span></td>
                        <td>${ultimoPunto}</td>
                    `;
                    tbody.appendChild(tr);
                });
            });
    }

    cargarAdminData();
    setInterval(cargarAdminData, 15000);
</script>

</body>
</html>
