<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La Gran Travesía 100K - Latitud Sur Expedition</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root {
            --lse-dark: #070a13;
            --lse-card: #0e1526;
            --lse-card-hover: #141d33;
            --lse-orange: #d97706; /* Naranja expedición */
            --lse-gold: #f59e0b;
            --lse-text: #f3f4f6;
            --lse-muted: #9ca3af;
            --lse-border: #1f2937;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: var(--lse-dark);
            color: var(--lse-text);
            margin: 0;
            padding: 0;
        }

        /* Barra superior estilo LSE */
        header {
            background-color: var(--lse-card);
            border-bottom: 1px solid var(--lse-border);
            padding: 20px 0;
            text-align: center;
        }
        header h4 {
            color: var(--lse-orange);
            font-size: 11px;
            letter-spacing: 4px;
            margin: 0 0 6px 0;
            text-transform: uppercase;
            font-weight: 700;
        }
        header h1 {
            color: #ffffff;
            font-size: 24px;
            margin: 0;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        .container { max-width: 1200px; margin: 0 auto; padding: 30px 20px; }

        /* Mapa */
        .map-section {
            background-color: var(--lse-card);
            border: 1px solid var(--lse-border);
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 30px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4);
        }
        .map-section h3 {
            color: var(--lse-gold);
            font-size: 14px;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-top: 0;
            margin-bottom: 15px;
            border-left: 3px solid var(--lse-orange);
            padding-left: 10px;
        }
        #map {
            height: 420px;
            border-radius: 6px;
            border: 1px solid var(--lse-border);
        }

        /* Buscador */
        .search-box {
            background-color: var(--lse-card);
            border: 1px solid var(--lse-border);
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 30px;
        }
        .search-box input {
            width: 100%;
            padding: 14px 16px;
            font-size: 15px;
            background-color: var(--lse-dark);
            border: 1px solid var(--lse-border);
            color: #fff;
            border-radius: 6px;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s;
        }
        .search-box input:focus {
            border-color: var(--lse-orange);
        }

        /* Tabla Estilo Profesional LSE */
        .table-container {
            background-color: var(--lse-card);
            border: 1px solid var(--lse-border);
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4);
        }
        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }
        th, td {
            padding: 14px 16px;
            border-bottom: 1px solid var(--lse-border);
            font-size: 13px;
        }
        th {
            background-color: #0b1120;
            color: var(--lse-gold);
            text-transform: uppercase;
            font-size: 11px;
            letter-spacing: 1px;
        }
        tr:hover { background-color: var(--lse-card-hover); }

        /* Badges de Estado */
        .badge {
            padding: 5px 10px;
            border-radius: 4px;
            font-weight: 700;
            font-size: 10px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }
        .badge-fin { background-color: #059669; color: #fff; }
        .badge-carrera { background-color: #0284c7; color: #fff; }
        .badge-dnf { background-color: #dc2626; color: #fff; }

        .tiempo-carrera { color: var(--lse-gold); font-weight: 700; font-family: monospace; font-size: 14px; }
        .update-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            font-size: 12px;
            color: var(--lse-muted);
        }
    </style>
</head>
<body>

<header>
    <h4>Latitud Sur Expedition</h4>
    <h1>La Gran Travesía 100K</h1>
</header>

<div class="container">
    
    <div class="map-section">
        <h3>Ruta Oficial &amp; Puntos de Control</h3>
        <div id="map"></div>
    </div>

    <div class="search-box">
        <input type="text" id="searchInput" placeholder="Buscar atleta por nombre o número de dorsal..." onkeyup="filtrarTabla()">
    </div>

    <div class="update-bar">
        <span>Resultados oficiales en tiempo real</span>
        <span id="updateInfo">Sincronizando...</span>
    </div>

    <div class="table-container">
        <div style="overflow-x: auto;">
            <table id="tablaCorredores">
                <thead>
                    <tr id="tableHeaders"></tr>
                </thead>
                <tbody id="cuerpoTabla"></tbody>
            </table>
        </div>
    </div>

</div>

<!-- Leaflet JS y Plugin GPX -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet-gpx/1.7.0/gpx.min.js"></script>

<script>
    const map = L.map('map').setView([-33.35, -70.65], 11);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap contributors',
        maxZoom: 18
    }).addTo(map);

    try {
        new L.GPX('ruta.gpx', { 
            async: true, 
            polyline_options: { color: '#d97706', weight: 4, opacity: 0.9 } 
        }).on('loaded', function(e) {
            map.fitBounds(e.target.getBounds());
        }).addTo(map);
    } catch(e) {
        console.log("Carga de GPX pendiente en el repositorio.");
    }

    let todosLosCorredores = [];

    function cargarDatos() {
        fetch('data.json?t=' + new Date().getTime())
            .then(response => response.json())
            .then(data => {
                todosLosCorredores = data.corredores;
                document.getElementById('updateInfo').innerText = "Última actualización: " + data.actualizado;
                
                if (todosLosCorredores.length > 0) {
                    construirTabla(todosLosCorredores);
                }
            })
            .catch(error => console.error('Error al cargar los datos:', error));
    }

    function construirTabla(corredores) {
        const primerCorredor = corredores[0];
        const ignorar = ["dorsal", "nombre", "categoria", "distancia", "sexo", "estado", "TIEMPO DE CARRERA"];
        let columnasDinamicas = Object.keys(primerCorredor).filter(k => !ignorar.includes(k));

        const trHead = document.getElementById('tableHeaders');
        let headHTML = `
            <th>Dorsal</th>
            <th>Atleta</th>
            <th>Distancia</th>
            <th>Categoría</th>
            <th>Sexo</th>
            <th>Estado</th>
            <th style="color: var(--lse-gold);">Tiempo Carrera</th>
        `;
        
        columnasDinamicas.forEach(col => {
            headHTML += `<th>${col}</th>`;
        });
        trHead.innerHTML = headHTML;

        mostrarFiltrados(corredores, columnasDinamicas);
    }

    function mostrarFiltrados(corredores, columnasDinamicas) {
        const tbody = document.getElementById('cuerpoTabla');
        tbody.innerHTML = "";

        corredores.forEach(c => {
            let badgeClass = "badge-carrera";
            let estadoUpper = (c.estado || "").toUpperCase();
            if (estadoUpper.includes("FIN") || estadoUpper.includes("FINALIZADO")) badgeClass = "badge-fin";
            else if (estadoUpper.includes("DNF")) badgeClass = "badge-dnf";

            let tiempoCarreraVal = c["TIEMPO DE CARRERA"] || '-';

            let trHTML = `
                <td><strong>#${c.dorsal}</strong></td>
                <td>${c.nombre}</td>
                <td>${c.distancia || '100K'}</td>
                <td>${c.categoria || 'INDIVIDUAL'}</td>
                <td>${c.sexo || 'M'}</td>
                <td><span class="badge ${badgeClass}">${c.estado}</span></td>
                <td class="tiempo-carrera">${tiempoCarreraVal}</td>
            `;

            columnasDinamicas.forEach(col => {
                let valor = c[col] || '-';
                trHTML += `<td>${valor}</td>`;
            });

            const tr = document.createElement('tr');
            tr.innerHTML = trHTML;
            tbody.appendChild(tr);
        });
    }

    function filtrarTabla() {
        const filtro = document.getElementById('searchInput').value.toLowerCase();
        const filtrados = todosLosCorredores.filter(c => {
            return c.nombre.toLowerCase().includes(filtro) || c.dorsal.toString().includes(filtro);
        });
        
        if (filtrados.length > 0) {
            const ignorar = ["dorsal", "nombre", "categoria", "distancia", "sexo", "estado", "TIEMPO DE CARRERA"];
            const columnasDinamicas = Object.keys(filtrados[0]).filter(k => !ignorar.includes(k));
            mostrarFiltrados(filtrados, columnasDinamicas);
        }
    }

    cargarDatos();
    setInterval(cargarDatos, 15000);
</script>

</body>
</html>
