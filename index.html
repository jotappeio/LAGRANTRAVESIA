<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seguimiento en Vivo - La Gran Travesía 100K</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-900 text-slate-100 font-sans min-h-screen">
    
    <!-- Encabezado -->
    <header class="bg-slate-950 border-b border-slate-800 py-4 px-6 sticky top-0 z-50">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <h1 class="text-lg font-bold tracking-wider text-amber-500 uppercase">La Gran Travesía 100K</h1>
            <span class="text-xs bg-amber-500/10 text-amber-400 px-3 py-1 rounded-full border border-amber-500/20 font-medium">Live Tracking</span>
        </div>
    </header>

    <main class="max-w-4xl mx-auto p-4 md:p-6 space-y-6">
        
        <!-- Buscador -->
        <div class="bg-slate-800/50 p-4 rounded-xl border border-slate-700/50 backdrop-blur">
            <label for="search" class="block text-sm font-medium text-slate-300 mb-2">Buscar por Nombre o Dorsal (BIB):</label>
            <input type="text" id="search" placeholder="Ej. 101 o Carlos..." 
                   class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-3 text-slate-100 focus:outline-none focus:border-amber-500 transition">
        </div>

        <!-- Listado / Leaderboard -->
        <div class="bg-slate-800/30 rounded-xl border border-slate-700/50 overflow-hidden">
            <div class="p-4 border-b border-slate-700/50 flex justify-between items-center">
                <h2 class="font-semibold text-slate-200">Competidores en Ruta</h2>
                <span id="update-time" class="text-xs text-slate-400">Sincronizando...</span>
            </div>
            
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse text-sm">
                    <thead>
                        <tr class="bg-slate-800/80 text-slate-400 border-b border-slate-700">
                            <th class="p-3 font-medium">Dorsal</th>
                            <th class="p-3 font-medium">Atleta</th>
                            <th class="p-3 font-medium">Categoría</th>
                            <th class="p-3 font-medium">Estado</th>
                            <th class="p-3 font-medium">Meta</th>
                        </tr>
                    </thead>
                    <tbody id="runners-table" class="divide-y divide-slate-800">
                        <!-- Se llena con JavaScript -->
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script>
        let corredoresGlobal = [];

        async function cargarDatos() {
            try {
                const response = await fetch('data.json?' + new Date().getTime());
                const data = await response.json();
                corredoresGlobal = data.corredores;
                document.getElementById('update-time').innerText = `Actualizado: ${data.actualizado}`;
                renderTable(corredoresGlobal);
            } catch (error) {
                console.error("Error al cargar datos:", error);
            }
        }

        function renderTable(data) {
            const tbody = document.getElementById('runners-table');
            tbody.innerHTML = '';
            
            if(data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="p-4 text-center text-slate-500">No se encontraron corredores.</td></tr>`;
                return;
            }

            data.forEach(c => {
                let badgeColor = c.estado === 'FIN' ? 'bg-emerald-500/10 text-emerald-400 border-emerald-500/20' : 'bg-amber-500/10 text-amber-400 border-amber-500/20';
                
                const tr = document.createElement('tr');
                tr.className = "hover:bg-slate-800/40 transition";
                tr.innerHTML = `
                    <td class="p-3 font-mono font-bold text-amber-400">#${c.dorsal}</td>
                    <td class="p-3 font-medium text-slate-100">${c.nombre}</td>
                    <td class="p-3 text-slate-400 text-xs">${c.categoria}</td>
                    <td class="p-3"><span class="px-2 py-0.5 rounded-full text-xs border ${badgeColor}">${c.estado}</span></td>
                    <td class="p-3 font-mono text-slate-300">${c.meta}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        document.getElementById('search').addEventListener('input', (e) => {
            const term = e.target.value.toLowerCase();
            const filtrados = corredoresGlobal.filter(c => 
                c.nombre.toLowerCase().includes(term) || c.dorsal.toString().includes(term)
            );
            renderTable(filtrados);
        });

        // Cargar al inicio y refrescar cada 30 segundos
        cargarDatos();
        setInterval(cargarDatos, 30000);
    </script>
</body>
</html>
