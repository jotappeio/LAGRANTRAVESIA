<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La Gran Travesía 100K - Seguimiento en Vivo</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0b1329;
            color: #ffffff;
            margin: 0;
            padding: 20px;
        }
        .container { max-width: 1200px; margin: 0 auto; }
        h1 { text-align: center; color: #f39c12; margin-bottom: 25px; }
        
        .map-container {
            background-color: #162247;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 25px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        #map {
            height: 400px;
            border-radius: 6px;
            border: 1px solid #2c3e50;
        }

        .search-box {
            background-color: #162247; padding: 20px; border-radius: 8px; margin-bottom: 25px;
        }
        .search-box input {
            width: 100%; padding: 12px; font-size: 16px; border-radius: 4px;
            border: 1px solid #2c3e50; background-color: #0b1329; color: white; box-sizing: border-box;
        }
        table {
            width: 100%; border-collapse: collapse; background-color: #162247;
            border-radius: 8px; overflow: hidden;
        }
        th, td { padding: 12px 15px; text-align: left; border-bottom: 1px solid #2c3e50; font-size: 14px; }
        th { background-color: #1f2d5a; color: #f39c12; text-transform: uppercase; }
        tr:hover { background-color: #1c2b59; }
        .badge { padding: 4px 8px; border-radius: 4px; font-weight: bold; font-size: 12px; }
        .badge-fin { background-color: #27ae60; color: white; }
        .badge-carrera { background-color: #2980b9; color: white; }
        .badge-dnf { background-color: #c0392b; color: white; }
        .tiempo-carrera { color: #f39c12; font-weight: bold; }
        .update-info { text-align: right; font-size: 12px; color: #95a5a6; margin-bottom: 10px; }
    </style>
</head>
<body>

<div class="container">
    <h1>LA GRAN TRAVESÍA 100K</h1>
    
    <div class="map-container">
        <h3 style="color: #f39c12; margin-top: 0; text-align: center;">Mapa de la Ruta &amp; Puestos de Control</h3>
        <div id="map"></div>
    </div>

    <div class="search-box">
        <input type="text" id="searchInput" placeholder="Buscar por Nombre o Dorsal..." onkeyup="filtrarTabla()">
    </div>

    <div id="updateInfo" class="update-info">Actualizando datos...</div>

    <div style="overflow-x: auto;">
        <table id="tablaCorredores">
            <thead>
                <tr id="tableHeaders"></tr>
            </thead>
            <tbody id="cuerpoTabla"></tbody>
        </table>
    </div>
</div>

<!-- Leaflet JS y Plugin GPX -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet-gpx/1.7.0/gpx.min.js"></script>

<script>
    const map = L.map('map').setView([-33.35, -70.65], 11);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap contributors',
        maxZoom: 18
    }).addTo(map);

    try {
        new L.GPX('ruta.gpx', { 
            async: true, 
            polyline_options: { color: '#f39c12', weight: 4, opacity: 0.8 } 
        }).on('loaded', function(e) {
            map.fitBounds(e.target.getBounds());
        }).addTo(map);
    } catch(e) {
        console.log("Carga de GPX pendiente en el repositorio.");
    }

    let todosLosCorredores = [];

    function cargarDatos() {
        fetch('data.json?t=' + new Date().getTime())
            .then(response => response.json())
            .then(data => {
                todosLosCorredores = data.corredores;
                document.getElementById('updateInfo').innerText = "Última actualización: " + data.actualizado;
                
                if (todosLosCorredores.length > 0) {
                    construirTabla(todosLosCorredores);
                }
            })
            .catch(error => console.error('Error al cargar los datos:', error));
    }

    function construirTabla(corredores) {
        const primerCorredor = corredores[0];
        const ignorar = ["dorsal", "nombre", "categoria", "distancia", "sexo", "estado", "TIEMPO DE CARRERA"];
        let columnasDinamicas = Object.keys(primerCorredor).filter(k => !ignorar.includes(k));

        const trHead = document.getElementById('tableHeaders');
        let headHTML = `
            <th>Dorsal</th>
            <th>Atleta</th>
            <th>Distancia</th>
            <th>Categoría</th>
            <th>Sexo</th>
            <th>Estado</th>
            <th style="color: #f39c12;">Tiempo Carrera</th>
        `;
        
        columnasDinamicas.forEach(col => {
            headHTML += `<th>${col}</th>`;
        });
        trHead.innerHTML = headHTML;

        mostrarFiltrados(corredores, columnasDinamicas);
    }

    function mostrarFiltrados(corredores, columnasDinamicas) {
        const tbody = document.getElementById('cuerpoTabla');
        tbody.innerHTML = "";

        corredores.forEach(c => {
            let badgeClass = "badge-carrera";
            let estadoUpper = (c.estado || "").toUpperCase();
            if (estadoUpper.includes("FIN") || estadoUpper.includes("FINALIZADO")) badgeClass = "badge-fin";
            else if (estadoUpper.includes("DNF")) badgeClass = "badge-dnf";

            let tiempoCarreraVal = c["TIEMPO DE CARRERA"] || '-';

            let trHTML = `
                <td><strong>#${c.dorsal}</strong></td>
                <td>${c.nombre}</td>
                <td>${c.distancia || '100K'}</td>
                <td>${c.categoria || 'INDIVIDUAL'}</td>
                <td>${c.sexo || 'M'}</td>
                <td><span class="badge ${badgeClass}">${c.estado}</span></td>
                <td class="tiempo-carrera">${tiempoCarreraVal}</td>
            `;

            columnasDinamicas.forEach(col => {
                let valor = c[col] || '-';
                trHTML += `<td>${valor}</td>`;
            });

            const tr = document.createElement('tr');
            tr.innerHTML = trHTML;
            tbody.appendChild(tr);
        });
    }

    function filtrarTabla() {
        const filtro = document.getElementById('searchInput').value.toLowerCase();
        const filtrados = todosLosCorredores.filter(c => {
            return c.nombre.toLowerCase().includes(filtro) || c.dorsal.toString().includes(filtro);
        });
        
        if (filtrados.length > 0) {
            const ignorar = ["dorsal", "nombre", "categoria", "distancia", "sexo", "estado", "TIEMPO DE CARRERA"];
            const columnasDinamicas = Object.keys(filtrados[0]).filter(k => !ignorar.includes(k));
            mostrarFiltrados(filtrados, columnasDinamicas);
        }
    }

    cargarDatos();
    setInterval(cargarDatos, 15000);
</script>

</body>
</html>
