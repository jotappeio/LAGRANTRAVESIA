<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="pageTitle">Latitud Sur Expedition</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root {
            --lse-dark: #07090e;
            --lse-card: #0f141f;
            --lse-border: #1f293d;
            --lse-orange: #f97316;
            --lse-gold: #fbbf24;
            --lse-text: #f3f4f6;
            --lse-muted: #9ca3af;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--lse-dark);
            color: var(--lse-text);
            margin: 0;
            padding: 10px;
            box-sizing: border-box;
        }

        .container { max-width: 1200px; margin: 0 auto; width: 100%; box-sizing: border-box; }

        .brand-header {
            text-align: center;
            padding: 10px 0 15px 0;
            border-bottom: 1px solid var(--lse-border);
            margin-bottom: 15px;
        }
        .brand-header img { max-height: 60px; margin-bottom: 8px; width: auto; max-width: 100%; }
        .brand-header span { color: var(--lse-orange); font-size: 10px; font-weight: 800; letter-spacing: 2px; text-transform: uppercase; }
        .brand-header h1 { margin: 6px 0 4px 0; font-size: 22px; font-weight: 700; color: #ffffff; }
        .brand-header p { margin: 0; font-size: 12px; color: var(--lse-muted); }

        .event-banner {
            width: 100%;
            max-height: 250px;
            object-fit: cover;
            border-radius: 8px;
            border: 1px solid var(--lse-border);
            margin-bottom: 15px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }

        .map-selector {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 12px;
        }
        .btn-map-tab {
            background-color: var(--lse-card); color: var(--lse-text); border: 1px solid var(--lse-border);
            padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: 700; font-size: 11px; text-transform: uppercase;
        }
        .btn-map-tab.active { background-color: var(--lse-orange); border-color: var(--lse-orange); color: white; }

        .map-wrapper {
            background-color: var(--lse-card); border: 1px solid var(--lse-border);
            border-radius: 8px; padding: 10px; margin-bottom: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.4);
        }
        .map-pane { height: 380px; border-radius: 6px; border: 1px solid var(--lse-border); display: none; width: 100%; z-index: 1; }
        .map-pane.active { display: block; }

        .search-container {
            background-color: var(--lse-card); border: 1px solid var(--lse-border); border-radius: 8px;
            padding: 12px; margin-bottom: 20px; display: flex; gap: 10px; flex-wrap: wrap; box-sizing: border-box;
        }
        .search-container input, .search-container select {
            flex: 1; min-width: 100%; padding: 10px 12px; font-size: 13px;
            background-color: var(--lse-dark); border: 1px solid var(--lse-border); color: white; border-radius: 6px; outline: none; box-sizing: border-box;
        }
        @media(min-width: 600px) {
            .search-container input, .search-container select { min-width: 200px; }
        }

        .table-container {
            background-color: var(--lse-card); border: 1px solid var(--lse-border);
            border-radius: 8px; overflow: hidden; box-shadow: 0 4px 20px rgba(0,0,0,0.4); margin-bottom: 25px;
        }
        .section-title {
            background-color: #131b2e; color: var(--lse-gold); padding: 10px 12px;
            font-size: 13px; font-weight: 700; text-transform: uppercase; border-bottom: 1px solid var(--lse-border);
            display: flex; justify-content: space-between; align-items: center;
        }

        .table-responsive { width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch; }
        table { width: 100%; border-collapse: collapse; text-align: left; font-size: 12px; white-space: nowrap; }
        th, td { padding: 10px 12px; border-bottom: 1px solid var(--lse-border); }
        th { background-color: #0b101c; color: var(--lse-muted); font-weight: 700; text-transform: uppercase; font-size: 10px; }
        tr:hover { background-color: rgba(249, 115, 22, 0.03); }

        .badge { padding: 3px 6px; border-radius: 4px; font-weight: 700; font-size: 9px; }
        .badge-fin { background-color: #059669; color: white; }
        .badge-carrera { background-color: #0284c7; color: white; }
        .badge-dnf { background-color: #dc2626; color: white; }

        .pos-badge { background-color: var(--lse-orange); color: white; font-weight: 800; padding: 2px 5px; border-radius: 4px; font-size: 11px; }
        .tiempo-carrera { color: var(--lse-gold); font-weight: 800; }
        .update-timestamp { text-align: right; font-size: 10px; color: var(--lse-muted); margin-bottom: 6px; }
        .my-tooltip { background: var(--lse-card); color: var(--lse-gold); border: 1px solid var(--lse-orange); font-weight: bold; font-size: 10px; padding: 2px 5px; border-radius: 4px; }

        .video-container {
            background-color: var(--lse-card); border: 1px solid var(--lse-border);
            border-radius: 8px; padding: 12px; margin: 20px 0; box-shadow: 0 4px 20px rgba(0,0,0,0.4); text-align: center; box-sizing: border-box;
        }
        .video-container h3 { color: var(--lse-gold); text-transform: uppercase; font-size: 13px; margin-top: 0; }
        .video-responsive { position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; border-radius: 6px; }
        .video-responsive iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; }

        .brand-footer { text-align: center; padding: 20px 0; border-top: 1px solid var(--lse-border); margin-top: 15px; }
        .brand-footer img { max-height: 45px; margin-top: 8px; width: auto; max-width: 100%; }
        .brand-footer p { font-size: 11px; color: var(--lse-muted); margin: 0; }
    </style>
</head>
<body>

<div class="container">
    <div class="brand-header">
        <div id="logoCabeceraContainer"></div>
        <span>Latitud Sur Expedition</span>
        <h1 id="lblNombreEvento">La Gran Travesía</h1>
        <p id="lblSubInfo">Resultados Oficiales en Tiempo Real</p>
    </div>

    <div id="portadaContainer"></div>

    <div class="map-selector">
        <button class="btn-map-tab active" id="tabRuta1" onclick="cambiarMapaPublico(1)"><span id="lblTab1">Ruta 1</span></button>
        <button class="btn-map-tab" id="tabRuta2" onclick="cambiarMapaPublico(2)"><span id="lblTab2">Ruta 2</span></button>
    </div>

    <div class="map-wrapper">
        <div id="mapPublic1" class="map-pane active"></div>
        <div id="mapPublic2" class="map-pane"></div>
    </div>

    <div class="search-container">
        <input type="text" id="searchInput" placeholder="Buscar por Nombre o Dorsal..." onkeyup="procesarYRenderizar()">
        <select id="filtroDistancia" onchange="procesarYRenderizar()">
            <option value="TODAS">Todas las Distancias</option>
        </select>
        <select id="filtroCategoria" onchange="procesarYRenderizar()">
            <option value="TODAS">Todas las Categorías</option>
        </select>
    </div>

    <div id="updateInfo" class="update-timestamp">Actualizando datos...</div>
    <div id="contenedorSecciones"></div>

    <div class="video-container" id="vimeoSection" style="display:none;">
        <h3>Video Oficial del Evento</h3>
        <div class="video-responsive">
            <iframe id="vimeoIframe" src="" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen></iframe>
        </div>
    </div>

    <div class="brand-footer">
        <p>Auspiciadores Oficiales</p>
        <div id="logoPieContainer"></div>
    </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet-gpx/1.7.0/gpx.min.js"></script>

<script>
    document.addEventListener("DOMContentLoaded", function() {
        fetch('config.json?t=' + new Date().getTime())
            .then(res => res.json())
            .then(cfg => {
                document.getElementById('lblNombreEvento').innerText = cfg.evento_nombre || "Latitud Sur Expedition";
                document.getElementById('pageTitle').innerText = (cfg.evento_nombre || "Evento") + " — LSE";
                document.getElementById('lblSubInfo').innerText = (cfg.evento_fecha || "") + " • " + (cfg.evento_ubicacion || "");

                let r1 = cfg.nombre_ruta1 || "100K";
                let r2 = cfg.nombre_ruta2 || "50K";
                document.getElementById('lblTab1').innerText = r1;
                document.getElementById('lblTab2').innerText = r2;

                if (cfg.logo_cabecera && cfg.logo_cabecera.trim() !== "") {
                    document.getElementById('logoCabeceraContainer').innerHTML = `<img src="${cfg.logo_cabecera}" alt="Logo">`;
                }
                if (cfg.portada_img && cfg.portada_img.trim() !== "") {
                    document.getElementById('portadaContainer').innerHTML = `<img src="${cfg.portada_img}" class="event-banner" alt="Portada">`;
                }
                if (cfg.logo_pie && cfg.logo_pie.trim() !== "") {
                    document.getElementById('logoPieContainer').innerHTML = `<img src="${cfg.logo_pie}" alt="Auspiciadores">`;
                }

                let vimeoIdMatch = (cfg.vimeo_id || "952091357").match(/(\d+)/);
                let vimeoId = vimeoIdMatch ? vimeoIdMatch[0] : "952091357";
                if (vimeoId) {
                    document.getElementById('vimeoIframe').src = `https://player.vimeo.com/video/${vimeoId}`;
                    document.getElementById('vimeoSection').style.display = 'block';
                }

                setTimeout(() => initMapasPublicos(cfg), 250);
            }).catch(err => console.log("Cargando web pública con valores predeterminados"));
    });

    let mapPub1, mapPub2, bounds1, bounds2;

    function initMapasPublicos(cfg) {
        let osm = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '&copy; OpenStreetMap' });
        let sat = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { maxZoom: 19, attribution: 'Tiles &copy; Esri' });
        let topo = L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', { maxZoom: 17, attribution: 'Map data: &copy; OpenStreetMap contributors, SRTM | Map style: &copy; OpenTopoMap (CC-BY-SA)' });

        let baseMaps = {
            "Topográfico (Curvas de Nivel)": topo,
            "Mapa Estándar": osm,
            "Satélite": sat
        };

        if (!mapPub1) {
            mapPub1 = L.map('mapPublic1', { center: [-33.35, -70.65], zoom: 11, layers: [topo] });
            L.control.layers(baseMaps).addTo(mapPub1);
        }
        if (!mapPub2) {
            mapPub2 = L.map('mapPublic2', { center: [-33.35, -70.65], zoom: 11, layers: [topo] });
            L.control.layers(baseMaps).addTo(mapPub2);
        }

        let url1 = cfg.url_gpx1 ? cfg.url_gpx1.trim() : "";
        if (url1 !== "") {
            new L.GPX(url1, { 
                async: true, 
                polyline_options: { color: '#f97316', weight: 5, opacity: 0.9 } 
            }).on('loaded', e => {
                bounds1 = e.target.getBounds();
                if (mapPub1) mapPub1.fitBounds(bounds1);
            }).addTo(mapPub1);
        }
        if (cfg.pcs_ruta1) {
            cfg.pcs_ruta1.forEach(pt => {
                L.circleMarker([pt.lat, pt.lon], { radius: 8, fillColor: '#f97316', color: "#fff", weight: 2, fillOpacity: 1 })
                 .addTo(mapPub1).bindTooltip(`<b>${pt.nombre}</b> (Km ${pt.km})`, {permanent: true, direction: 'top', className: 'my-tooltip'});
            });
        }

        let url2 = cfg.url_gpx2 ? cfg.url_gpx2.trim() : "";
        if (url2 !== "") {
            new L.GPX(url2, { 
                async: true, 
                polyline_options: { color: '#fbbf24', weight: 5, opacity: 0.9 } 
            }).on('loaded', e => {
                bounds2 = e.target.getBounds();
            }).addTo(mapPub2);
        }
        if (cfg.pcs_ruta2) {
            cfg.pcs_ruta2.forEach(pt => {
                L.circleMarker([pt.lat, pt.lon], { radius: 8, fillColor: '#fbbf24', color: "#fff", weight: 2, fillOpacity: 1 })
                 .addTo(mapPub2).bindTooltip(`<b>${pt.nombre}</b> (Km ${pt.km})`, {permanent: true, direction: 'top', className: 'my-tooltip'});
            });
        }

        setTimeout(() => {
            if (mapPub1) {
                mapPub1.invalidateSize();
                if (bounds1) mapPub1.fitBounds(bounds1);
            }
        }, 400);
    }

    function cambiarMapaPublico(num) {
        document.getElementById('mapPublic1').classList.remove('active');
        document.getElementById('mapPublic2').classList.remove('active');
        document.getElementById('tabRuta1').classList.remove('active');
        document.getElementById('tabRuta2').classList.remove('active');

        document.getElementById(`mapPublic${num}`).classList.add('active');
        document.getElementById(`tabRuta${num}`).classList.add('active');

        setTimeout(() => {
            if (num === 1 && mapPub1) {
                mapPub1.invalidateSize();
                if (bounds1) mapPub1.fitBounds(bounds1);
            }
            if (num === 2 && mapPub2) {
                mapPub2.invalidateSize();
                if (bounds2) mapPub2.fitBounds(bounds2);
                else {
                    fetch('config.json').then(r=>r.json()).then(cfg=>{
                        if (cfg.url_gpx2) {
                            new L.GPX(cfg.url_gpx2, { async: true }).on('loaded', e => {
                                bounds2 = e.target.getBounds();
                                mapPub2.fitBounds(bounds2);
                            }).addTo(mapPub2);
                        }
                    });
                }
            }
        }, 150);
    }

    let todosLosCorredores = [], columnasDinamicasGlobales = [];

    function cargarDatos() {
        fetch('data.json?t=' + new Date().getTime())
            .then(res => res.json())
            .then(data => {
                todosLosCorredores = data.corredores;
                document.getElementById('updateInfo').innerText = "Última sincronización: " + data.actualizado;
                if (todosLosCorredores.length > 0) {
                    inicializarFiltros(todosLosCorredores);
                    procesarYRenderizar();
                }
            });
    }

    function inicializarFiltros(corredores) {
        let p = corredores[0];
        let ign = ["dorsal", "nombre", "categoria", "distancia", "sexo", "estado", "TIEMPO DE CARRERA"];
        columnasDinamicasGlobales = Object.keys(p).filter(k => !ign.includes(k));

        let dists = [...new Set(corredores.map(c => c.distancia || "100K"))];
        let cats = [...new Set(corredores.map(c => c.categoria || "INDIVIDUAL"))];

        let sd = document.getElementById('filtroDistancia');
        sd.innerHTML = '<option value="TODAS">Todas las Distancias</option>';
        dists.forEach(d => sd.innerHTML += `<option value="${d}">${d}</option>`);

        let sc = document.getElementById('filtroCategoria');
        sc.innerHTML = '<option value="TODAS">Todas las Categorías</option>';
        cats.forEach(c => sc.innerHTML += `<option value="${c}">${c}</option>`);
    }

    function convertirHoraASegundos(strHora) {
        if (!strHora || strHora === "-") return 999999;
        let p = strHora.split(":");
        if (p.length < 2) return 999999;
        return (parseInt(p[0]) * 3600) + (parseInt(p[1]) * 60) + (p[2] ? parseInt(p[2]) : 0);
    }

    // Función auxiliar para contar cuántos Puntos de Control (columnas dinámicas) tiene marcados un corredor
    function contarPCsRegistrados(corredor) {
        let count = 0;
        columnasDinamicasGlobales.forEach(col => {
            let val = corredor[col];
            if (val && val !== "-" && val.trim() !== "") {
                count++;
            }
        });
        return count;
    }

    function procesarYRenderizar() {
        let txt = document.getElementById('searchInput').value.toLowerCase();
        let fd = document.getElementById('filtroDistancia').value;
        let fc = document.getElementById('filtroCategoria').value;

        let filtrados = todosLosCorredores.filter(c => {
            let matchTxt = c.name?.toLowerCase().includes(txt) || c.nombre?.toLowerCase().includes(txt) || c.dorsal.toString().includes(txt);
            let matchDist = (fd === "TODAS" || (c.distancia || "100K") === fd);
            let matchCat = (fc === "TODAS" || (c.categoria || "INDIVIDUAL") === fc);
            return matchTxt && matchDist && matchCat;
        });

        // REGLA DE ORDENAMIENTO PROFESIONAL EN VIVO:
        // 1. Los DNF (retirados) van siempre al fondo de la tabla.
        // 2. Prioridad 1: Quien tenga más Puntos de Control registrados (va más adelante en la ruta).
        // 3. Prioridad 2 (Desempate): Menor tiempo de carrera acumulado.
        filtrados.sort((a, b) => {
            let ea = (a.estado||"").toUpperCase(), eb = (b.estado||"").toUpperCase();
            let aDnf = ea.includes("DNF"), bDnf = eb.includes("DNF");
            
            if (aDnf && !bDnf) return 1;
            if (!aDnf && bDnf) return -1;

            let pcsA = contarPCsRegistrados(a);
            let pcsB = contarPCsRegistrados(b);

            // Si tienen distinto número de puntos de control, el que tenga más va primero
            if (pcsA !== pcsB) {
                return pcsB - pcsA; // Mayor cantidad de PCs primero
            }

            // Si están en el mismo punto de control, desempata el menor tiempo de carrera
            let ta = convertirHoraASegundos(a["TIEMPO DE CARRERA"]);
            let tb = convertirHoraASegundos(b["TIEMPO DE CARRERA"]);
            return ta - tb;
        });

        let grupos = {};
        filtrados.forEach(c => {
            let d = c.distancia || "100K", cat = c.categoria || "INDIVIDUAL", s = c.sexo || "M";
            let k = `${d} — ${cat} (${s})`;
            if (!grupos[k]) grupos[k] = [];
            grupos[k].push(c);
        });

        let cont = document.getElementById('contenedorSecciones');
        cont.innerHTML = "";
        for (let [gNombre, atletas] of Object.entries(grupos)) {
            let html = `<div class="table-container">
                <div class="section-title"><span>${gNombre}</span><span style="font-size:11px; color:var(--lse-muted);">${atletas.length} Atletas</span></div>
                <div class="table-responsive"><table><thead><tr><th>Pos</th><th>Dorsal</th><th>Atleta</th><th>Estado</th><th style="color:var(--lse-gold);">Tiempo</th>`;
            columnasDinamicasGlobales.forEach(col => html += `<th>${col}</th>`);
            html += `</tr></thead><tbody>`;

            atletas.forEach((c, idx) => {
                let badge = "badge-carrera", eu = (c.estado||"").toUpperCase();
                if (eu.includes("FIN")||eu.includes("FINALIZADO")) badge = "badge-fin";
                else if (eu.includes("DNF")) badge = "badge-dnf";
                
                // Asigna posición provisoria (1°, 2°, 3°, 4°...) a todos los que estén compitiendo o hayan finalizado
                let pos = !eu.includes("DNF") ? `<span class="pos-badge">${idx+1}</span>` : `-`;

                html += `<tr><td>${pos}</td><td><b>#${c.dorsal}</b></td><td>${c.name || c.nombre}</td><td><span class="badge ${badge}">${c.estado}</span></td><td class="tiempo-carrera">${c["TIEMPO DE CARRERA"]||'-'}</td>`;
                columnasDinamicasGlobales.forEach(col => html += `<td>${c[col]||'-'}</td>`);
                html += `</tr>`;
            });
            html += `</tbody></table></div></div>`;
            cont.innerHTML += html;
        }
    }

    cargarDatos();
    setInterval(cargarDatos, 15000);
</script>

</body>
</html>
