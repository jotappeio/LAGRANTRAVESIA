<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="pageTitle">Latitud Sur Expedition</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root {
            --lse-dark: #07090e;
            --lse-card: #0f141f;
            --lse-border: #1f293d;
            --lse-orange: #f97316;
            --lse-gold: #fbbf24;
            --lse-text: #f3f4f6;
            --lse-muted: #9ca3af;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--lse-dark);
            color: var(--lse-text);
            margin: 0;
            padding: 20px;
        }

        .container { max-width: 1200px; margin: 0 auto; }

        .brand-header {
            text-align: center;
            padding: 10px 0 20px 0;
            border-bottom: 1px solid var(--lse-border);
            margin-bottom: 25px;
        }
        .brand-header img {
            max-height: 70px;
            margin-bottom: 10px;
        }
        .brand-header span {
            color: var(--lse-orange);
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 3px;
            text-transform: uppercase;
        }
        .brand-header h1 {
            margin: 6px 0 4px 0;
            font-size: 26px;
            font-weight: 700;
            color: #ffffff;
        }
        .brand-header p {
            margin: 0;
            font-size: 13px;
            color: var(--lse-muted);
        }

        .map-wrapper {
            background-color: var(--lse-card);
            border: 1px solid var(--lse-border);
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 25px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
        }
        .map-wrapper h3 {
            margin: 0 0 12px 0;
            font-size: 14px;
            color: var(--lse-gold);
            text-transform: uppercase;
            letter-spacing: 1px;
            text-align: center;
        }
        #map {
            height: 400px;
            border-radius: 6px;
            border: 1px solid var(--lse-border);
        }

        .search-container {
            background-color: var(--lse-card);
            border: 1px solid var(--lse-border);
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 25px;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }
        .search-container input, .search-container select {
            flex: 1;
            min-width: 200px;
            padding: 12px 15px;
            font-size: 14px;
            background-color: var(--lse-dark);
            border: 1px solid var(--lse-border);
            color: white;
            border-radius: 6px;
            outline: none;
        }
        .search-container input:focus, .search-container select:focus {
            border-color: var(--lse-orange);
        }

        .table-container {
            background-color: var(--lse-card);
            border: 1px solid var(--lse-border);
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
            margin-bottom: 30px;
        }
        
        .section-title {
            background-color: #131b2e;
            color: var(--lse-gold);
            padding: 12px 15px;
            font-size: 14px;
            font-weight: 700;
            text-transform: uppercase;
            border-bottom: 1px solid var(--lse-border);
            display: flex;
            justify-content: space-between;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 13px;
        }
        th, td {
            padding: 12px 15px;
            border-bottom: 1px solid var(--lse-border);
        }
        th {
            background-color: #0b101c;
            color: var(--lse-muted);
            font-weight: 700;
            text-transform: uppercase;
            font-size: 11px;
        }
        tr:hover { background-color: rgba(249, 115, 22, 0.03); }

        .badge { padding: 4px 8px; border-radius: 4px; font-weight: 700; font-size: 10px; }
        .badge-fin { background-color: #059669; color: white; }
        .badge-carrera { background-color: #0284c7; color: white; }
        .badge-dnf { background-color: #dc2626; color: white; }

        .pos-badge { background-color: var(--lse-orange); color: white; font-weight: 800; padding: 2px 6px; border-radius: 4px; font-size: 12px; }
        .tiempo-carrera { color: var(--lse-gold); font-weight: 800; }
        .update-timestamp { text-align: right; font-size: 11px; color: var(--lse-muted); margin-bottom: 8px; }

        /* Pie de página con Auspiciadores */
        .brand-footer {
            text-align: center;
            padding: 25px 0;
            border-top: 1px solid var(--lse-border);
            margin-top: 40px;
        }
        .brand-footer img {
            max-height: 50px;
            margin-top: 10px;
        }
        .brand-footer p {
            font-size: 12px;
            color: var(--lse-muted);
            margin: 0;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="brand-header">
        <div id="logoCabeceraContainer"></div>
        <span>Latitud Sur Expedition</span>
        <h1 id="lblNombreEvento">La Gran Travesía 100K</h1>
        <p id="lblSubInfo">Resultados Oficiales en Tiempo Real</p>
    </div>

    <!-- MAPA CORREGIDO -->
    <div class="map-wrapper">
        <h3>Mapa Oficial de la Ruta &amp; Puestos de Control</h3>
        <div id="map"></div>
    </div>

    <div class="search-container">
        <input type="text" id="searchInput" placeholder="Buscar por Nombre o Dorsal..." onkeyup="procesarYRenderizar()">
        <select id="filtroDistancia" onchange="procesarYRenderizar()">
            <option value="TODAS">Todas las Distancias</option>
        </select>
        <select id="filtroCategoria" onchange="procesarYRenderizar()">
            <option value="TODAS">Todas las Categorías</option>
        </select>
    </div>

    <div id="updateInfo" class="update-timestamp">Actualizando datos...</div>

    <div id="contenedorSecciones"></div>

    <div class="brand-footer">
        <p>Auspiciadores Oficiales</p>
        <div id="logoPieContainer"></div>
    </div>
</div>

<!-- Leaflet JS y Plugin GPX -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet-gpx/1.7.0/gpx.min.js"></script>

<script>
    // Inicializar metadatos y marcas guardadas
    document.addEventListener("DOMContentLoaded", function() {
        const nombreEv = localStorage.getItem("lse_evento_nombre") || "La Gran Travesía 100K";
        const fechaEv = localStorage.getItem("lse_evento_fecha") || "";
        const ubiEv = localStorage.getItem("lse_evento_ubicacion") || "";

        document.getElementById('lblNombreEvento').innerText = nombreEv;
        document.getElementById('pageTitle').innerText = `${nombreEv} — Latitud Sur Expedition`;
        document.getElementById('lblSubInfo').innerText = `${fechaEv} • ${ubiEv}`;

        // Cargar Logos guardados si existen
        const logoCab = localStorage.getItem("lse_logo_cabecera");
        if (logoCab) {
            document.getElementById('logoCabeceraContainer').innerHTML = `<img src="${logoCab}" alt="Logo Evento">`;
        }

        const logoPie = localStorage.getItem("lse_logo_pie");
        if (logoPie) {
            document.getElementById('logoPieContainer').innerHTML = `<img src="${logoPie}" alt="Auspiciadores">`;
        }

        // Inicializar mapa público con retardo corto para asegurar renderizado correcto
        setTimeout(initMapaPublico, 200);
    });

    let map;
    function initMapaPublico() {
        if (map) return;
        map = L.map('map').setView([-33.35, -70.65], 11);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 18 }).addTo(map);

        const gpxGuardado = localStorage.getItem("gpxRutaGuardada");
        if (gpxGuardado) {
            new L.GPX(gpxGuardado, { async: true, polyline_options: { color: '#f97316', weight: 4, opacity: 0.9 } })
              .on('loaded', function(e) { map.fitBounds(e.target.getBounds()); })
              .addTo(map);
        } else {
            // Intentar cargar ruta.gpx predeterminada si existe
            try {
                new L.GPX('ruta.gpx', { async: true, polyline_options: { color: '#f97316', weight: 4, opacity: 0.9 } })
                  .on('loaded', function(e) { map.fitBounds(e.target.getBounds()); })
                  .addTo(map);
            } catch(e) { console.log("Ruta GPX no detectada."); }
        }
    }

    let todosLosCorredores = [];
    let columnasDinamicasGlobales = [];

    function cargarDatos() {
        fetch('data.json?t=' + new Date().getTime())
            .then(response => response.json())
            .then(data => {
                todosLosCorredores = data.corredores;
                document.getElementById('updateInfo').innerText = "Última sincronización: " + data.actualizado;
                if (todosLosCorredores.length > 0) {
                    inicializarFiltrosYColumnas(todosLosCorredores);
                    procesarYRenderizar();
                }
            })
            .catch(error => console.error('Error al cargar datos:', error));
    }

    function inicializarFiltrosYColumnas(corredores) {
        const primerCorredor = corredores[0];
        const ignorar = ["dorsal", "nombre", "categoria", "distancia", "sexo", "estado", "TIEMPO DE CARRERA"];
        columnasDinamicasGlobales = Object.keys(primerCorredor).filter(k => !ignorar.includes(k));

        const distancias = [...new Set(corredores.map(c => c.distancia || "100K"))];
        const categorias = [...new Set(corredores.map(c => c.categoria || "INDIVIDUAL"))];

        const selDist = document.getElementById('filtroDistancia');
        const selCat = document.getElementById('filtroCategoria');

        selDist.innerHTML = '<option value="TODAS">Todas las Distancias</option>';
        distancias.forEach(d => selDist.innerHTML += `<option value="${d}">${d}</option>`);

        selCat.innerHTML = '<option value="TODAS">Todas las Categorías</option>';
        categorias.forEach(cat => selCat.innerHTML += `<option value="${cat}">${cat}</option>`);
    }

    function convertirHoraASegundos(strHora) {
        if (!strHora || strHora === "-") return 999999;
        const partes = strHora.split(":");
        if (partes.length < 2) return 999999;
        return (parseInt(partes[0]) * 3600) + (parseInt(partes[1]) * 60) + (partes[2] ? parseInt(partes[2]) : 0);
    }

    function procesarYRenderizar() {
        const textoBusqueda = document.getElementById('searchInput').value.toLowerCase();
        const distFiltro = document.getElementById('filtroDistancia').value;
        const catFiltro = document.getElementById('filtroCategoria').value;

        let filtrados = todosLosCorredores.filter(c => {
            const coincideTexto = c.nombre.toLowerCase().includes(textoBusqueda) || c.dorsal.toString().includes(textoBusqueda);
            const coincideDist = (distFiltro === "TODAS" || (c.distancia || "100K") === distFiltro);
            const coincideCat = (catFiltro === "TODAS" || (c.categoria || "INDIVIDUAL") === catFiltro);
            return coincideTexto && coincideDist && coincideCat;
        });

        filtrados.sort((a, b) => {
            const estA = (a.estado || "").toUpperCase();
            const estB = (b.estado || "").toUpperCase();
            const esFinA = estA.includes("FIN") || estA.includes("FINALIZADO");
            const esFinB = estB.includes("FIN") || estB.includes("FINALIZADO");
            const esDnfA = estA.includes("DNF");
            const esDnfB = estB.includes("DNF");

            if (esFinA && !esFinB) return -1;
            if (!esFinA && esFinB) return 1;
            if (esFinA && esFinB) return convertirHoraASegundos(a["TIEMPO DE CARRERA"]) - convertirHoraASegundos(b["TIEMPO DE CARRERA"]);
            if (esDnfA && !esDnfB) return 1;
            if (!esDnfA && esDnfB) return -1;

            let idxA = -1, idxB = -1;
            columnasDinamicasGlobales.forEach((col, idx) => {
                if (a[col] && a[col] !== "-") idxA = idx;
                if (b[col] && b[col] !== "-") idxB = idx;
            });
            return idxB - idxA;
        });

        let grupos = {};
        filtrados.forEach(c => {
            const dist = c.distancia || "100K";
            const cat = c.categoria || "INDIVIDUAL";
            const sexo = c.sexo || "M";
            const clave = `${dist} — ${cat} (${sexo})`;
            if (!grupos[clave]) grupos[clave] = [];
            grupos[clave].push(c);
        });

        const contenedor = document.getElementById('contenedorSecciones');
        contenedor.innerHTML = "";

        for (const [grupoNombre, listaAtletas] of Object.entries(grupos)) {
            let tableHTML = `
                <div class="table-container">
                    <div class="section-title">
                        <span>${grupoNombre}</span>
                        <span style="font-size: 11px; color: var(--lse-muted);">${listaAtletas.length} Atletas</span>
                    </div>
                    <div style="overflow-x: auto;">
                        <table>
                            <thead>
                                <tr>
                                    <th>Pos</th>
                                    <th>Dorsal</th>
                                    <th>Atleta</th>
                                    <th>Estado</th>
                                    <th style="color: var(--lse-gold);">Tiempo Carrera</th>
            `;
            columnasDinamicasGlobales.forEach(col => tableHTML += `<th>${col}</th>`);
            tableHTML += `</tr></thead><tbody>`;

            listaAtletas.forEach((c, idx) => {
                let badgeClass = "badge-carrera";
                let estadoUpper = (c.estado || "").toUpperCase();
                if (estadoUpper.includes("FIN") || estadoUpper.includes("FINALIZADO")) badgeClass = "badge-fin";
                else if (estadoUpper.includes("DNF")) badgeClass = "badge-dnf";

                let tiempoCarreraVal = c["TIEMPO DE CARRERA"] || '-';
                let posDisplay = (estadoUpper.includes("FIN") || estadoUpper.includes("FINALIZADO")) ? `<span class="pos-badge">${idx + 1}</span>` : `-`;

                tableHTML += `
                    <tr>
                        <td>${posDisplay}</td>
                        <td><strong>#${c.dorsal}</strong></td>
                        <td>${c.nombre}</td>
                        <td><span class="badge ${badgeClass}">${c.estado}</span></td>
                        <td class="tiempo-carrera">${tiempoCarreraVal}</td>
                `;
                columnasDinamicasGlobales.forEach(col => tableHTML += `<td>${c[col] || '-'}</td>`);
                tableHTML += `</tr>`;
            });

            tableHTML += `</tbody></table></div></div>`;
            contenedor.innerHTML += tableHTML;
        }
    }

    cargarDatos();
    setInterval(cargarDatos, 15000);
</script>

</body>
